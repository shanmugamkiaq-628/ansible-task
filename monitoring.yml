---
- name: Install Prometheus and Grafana monitoring stack
  hosts: local
  connection: local
  become: true
 
  vars:
    monitoring_dir: /opt/monitoring
 
  tasks:
    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
 
    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
 
    - name: Create monitoring directory
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        mode: "0755"
 
    - name: Create Prometheus configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/prometheus.yml"
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s
 
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["prometheus:9090"]
 
            - job_name: node-exporter
              static_configs:
                - targets: ["node-exporter:9100"]
 
    - name: Create Docker Compose configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/compose.yaml"
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus_data:/prometheus
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--storage.tsdb.path=/prometheus"
 
            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              restart: unless-stopped
              ports:
                - "9100:9100"
              pid: host
              command:
                - "--path.rootfs=/host"
              volumes:
                - "/:/host:ro,rslave"
 
            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
 
          volumes:
            prometheus_data:
            grafana_data:
 
    - name: Start Prometheus, Grafana and Node Exporter
      ansible.builtin.command:
        cmd: docker compose -f compose.yaml up -d
        chdir: "{{ monitoring_dir }}"
      register: monitoring_start
      changed_when: true
 
    - name: Wait for Prometheus port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9090
        timeout: 180
 
    - name: Wait for Grafana port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 180
 
    - name: Display monitoring URLs
      ansible.builtin.debug:
        msg:
          - "Prometheus: http://YOUR_EC2_PUBLIC_IP:9090"
          - "Grafana: http://YOUR_EC2_PUBLIC_IP:3000"
          - "Node Exporter metrics: http://YOUR_EC2_PUBLIC_IP:9100/metrics"