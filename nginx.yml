---
- name: Install and configure Nginx
  hosts: nginx_hosts
  become: true
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Deploy practice landing page
      ansible.builtin.template:
        src: ../templates/nginx-index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx
    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
    - name: Verify local HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      register: nginx_response
      retries: 5
      delay: 2
      until: nginx_response.status == 200
  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
