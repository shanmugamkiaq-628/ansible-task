---
- name: Install and configure SonarQube on Ubuntu EC2
  hosts: local
  connection: local
  become: true
 
  vars:
    sonarqube_container: sonarqube
    sonarqube_image: sonarqube:lts-community
    sonarqube_port: 9000
 
  tasks:
    - name: Install Docker and required packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - curl
        state: present
        update_cache: true
 
    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
 
    - name: Configure Linux virtual memory for Elasticsearch
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "524288"
        state: present
        reload: true
 
    - name: Configure maximum open files for the host
      ansible.posix.sysctl:
        name: fs.file-max
        value: "131072"
        state: present
        reload: true
 
    - name: Pull SonarQube Community image
      ansible.builtin.command:
        cmd: docker pull {{ sonarqube_image }}
      register: sonarqube_pull
      changed_when: "'Downloaded newer image' in sonarqube_pull.stdout or 'Pull complete' in sonarqube_pull.stdout"
 
    - name: Create SonarQube data volume
      ansible.builtin.command:
        cmd: docker volume create sonarqube_data
      register: data_volume
      changed_when: "'sonarqube_data' in data_volume.stdout"
 
    - name: Create SonarQube extensions volume
      ansible.builtin.command:
        cmd: docker volume create sonarqube_extensions
      register: extensions_volume
      changed_when: "'sonarqube_extensions' in extensions_volume.stdout"
 
    - name: Create SonarQube logs volume
      ansible.builtin.command:
        cmd: docker volume create sonarqube_logs
      register: logs_volume
      changed_when: "'sonarqube_logs' in logs_volume.stdout"
 
    - name: Check if SonarQube container exists
      ansible.builtin.command:
        cmd: docker container inspect {{ sonarqube_container }}
      register: sonarqube_existing
      changed_when: false
      failed_when: false
 
    - name: Start SonarQube container
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name {{ sonarqube_container }}
          --restart unless-stopped
          -p {{ sonarqube_port }}:9000
          -v sonarqube_data:/opt/sonarqube/data
          -v sonarqube_extensions:/opt/sonarqube/extensions
          -v sonarqube_logs:/opt/sonarqube/logs
          {{ sonarqube_image }}
      when: sonarqube_existing.rc != 0
      changed_when: true
 
    - name: Start existing SonarQube container if stopped
      ansible.builtin.command:
        cmd: docker start {{ sonarqube_container }}
      register: sonarqube_start
      when: sonarqube_existing.rc == 0
      changed_when: "'already running' not in (sonarqube_start.stderr | default(''))"
 
    - name: Wait for SonarQube port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ sonarqube_port }}"
        delay: 10
        timeout: 300
 
    - name: Display SonarQube URL
      ansible.builtin.debug:
        msg: "SonarQube is available at http://YOUR_EC2_PUBLIC_IP:9000"