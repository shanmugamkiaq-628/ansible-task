---
- name: Install Prometheus and Grafana on Ubuntu
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  tasks:
    - name: Install Prometheus and prerequisites
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-node-exporter
          - apt-transport-https
          - software-properties-common
          - wget
          - gpg
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Add Grafana repository signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /usr/share/keyrings/grafana.asc
        mode: "0644"
    - name: Add Grafana apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present
        update_cache: true
    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true
    - name: Deploy Prometheus scrape configuration
      ansible.builtin.template:
        src: ../templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Prometheus
    - name: Enable and start Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: started
        enabled: true
    - name: Enable and start Node Exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: started
        enabled: true
    - name: Enable and start Grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: started
        enabled: true
    - name: Show monitoring URLs
      ansible.builtin.debug:
        msg:
          - "Prometheus: http://{{ ansible_host | default(inventory_hostname) }}:9090"
          - "Grafana: http://{{ ansible_host | default(inventory_hostname) }}:3000 (initial lab login commonly admin/admin; change at first login)"
  handlers:
    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
